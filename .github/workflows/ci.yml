name: CI

# Triggers are DELIBERATELY main+PR only (TRDD-XGFJCCJ9): every failed run mails the
# repo owner, and notification fatigue makes the one real failure invisible. Topic
# branches run nothing — do not "add a quick lint job" for them; that adds a new
# failure-mail surface, the exact defect the card closed. The owner-side half of the
# fix is GitHub watch settings: repo → Watch → Custom → untick Actions, or notify
# on failed workflows only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      # The decoupling scanner REFUSES to run without ripgrep (exit 2, deliberately —
      # a partial scan reporting clean is the bug it guards against), and ubuntu-latest
      # does not ship rg. Without this step 3 tests fail as could-not-run (TRDD-N4SDG0ML).
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build
        run: |
          mkdir -p data
          touch data/.help-build-success
          yarn build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # NT-039: Add TypeScript type-checking step
      - name: Type check
        run: yarn tsc --noEmit
